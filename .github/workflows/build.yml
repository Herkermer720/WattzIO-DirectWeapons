name: Build Direct Weapon Swap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Clone upstream WattzIO
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/AbbieDoobie/WattzIO.git upstream

      - name: Patch WattzIO for direct D-pad weapon selection
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("upstream/mods/WIO-WeaponSwap/src/InputHook.h")
          text = path.read_text(encoding="utf-8")

          old = """						if (blockHotkeys) {
							continue;
						}
						switch (ResolveBinding(*keycode, *button)) {
"""

          new = """						if (blockHotkeys) {
							continue;
						}

						// Direct controller weapon selection:
						// D-pad Left  -> Favorite 1
						// D-pad Down  -> Favorite 2
						// D-pad Right -> Favorite 3
						//
						// Fire on press rather than release and consume these inputs
						// before the vanilla input receiver sees them.
						if (const auto directSlot = DirectSlotFor(*keycode); directSlot) {
							HandleDirectSlotEvent(*button, *directSlot);
							continue;
						}

						switch (ResolveBinding(*keycode, *button)) {
"""

          if old not in text:
              raise SystemExit("Could not find the expected input-processing block.")

          text = text.replace(old, new, 1)

          old = """			_original(a_this, a_queueHead);
		}
		static void HandleEvent(RE::ButtonEvent& a_event)
"""

          new = """			ForwardUnconsumed(a_this, a_queueHead, blockHotkeys);
		}

		// F4SE unified gamepad keycodes:
		// 267 = D-pad Down
		// 268 = D-pad Left
		// 269 = D-pad Right
		[[nodiscard]] static std::optional<std::size_t> DirectSlotFor(std::uint32_t a_keycode)
		{
			switch (a_keycode) {
			case 268:
				return 0;  // D-pad Left -> Favorite 1
			case 267:
				return 1;  // D-pad Down -> Favorite 2
			case 269:
				return 2;  // D-pad Right -> Favorite 3
			default:
				return std::nullopt;
			}
		}

		static void HandleDirectSlotEvent(RE::ButtonEvent& a_event, std::size_t a_slotIndex)
		{
			if (a_event.QJustPressed()) {
				WeaponSwapLogic::TriggerSlot(a_event, a_slotIndex);
			}
		}

		// Forward the original engine-owned input queue while temporarily removing
		// only the three direct D-pad events. This prevents vanilla Favorites from
		// also seeing those buttons without changing Fallout 4's controller mapping.
		static void ForwardUnconsumed(
			RE::BSInputEventReceiver* a_this,
			const RE::InputEvent* a_queueHead,
			bool a_blockHotkeys)
		{
			if (a_blockHotkeys) {
				_original(a_this, a_queueHead);
				return;
			}

			auto* segmentStart = const_cast<RE::InputEvent*>(a_queueHead);
			auto* previous = static_cast<RE::InputEvent*>(nullptr);

			for (auto* event = segmentStart; event; ) {
				auto* next = const_cast<RE::InputEvent*>(event->next);

				bool consumed = false;

				if (const auto button = event->As<RE::ButtonEvent>(); button) {
					if (const auto keycode = ToUnifiedKeycode(*button); keycode) {
						consumed = DirectSlotFor(*keycode).has_value();
					}
				}

				if (consumed) {
					if (previous) {
						auto* savedNext = previous->next;
						previous->next = nullptr;

						_original(a_this, segmentStart);

						previous->next = savedNext;
					}

					segmentStart = next;
					previous = nullptr;
				} else {
					previous = event;
				}

				event = next;
			}

			if (segmentStart) {
				_original(a_this, segmentStart);
			}
		}

		static void HandleEvent(RE::ButtonEvent& a_event)
"""

          if old not in text:
              raise SystemExit("Could not find the expected original input-forwarding block.")

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("Direct weapon-selection patch applied successfully.")
          '@ | Set-Content -Encoding utf8 patch.py

          python patch.py

      - name: Verify patch
        shell: pwsh
        run: |
          $file = "upstream/mods/WIO-WeaponSwap/src/InputHook.h"

          if (-not (Select-String -Path $file -Pattern "DirectSlotFor")) {
            throw "DirectSlotFor was not found."
          }

          if (-not (Select-String -Path $file -Pattern "ForwardUnconsumed")) {
            throw "ForwardUnconsumed was not found."
          }

          if (-not (Select-String -Path $file -Pattern "WeaponSwapLogic::TriggerSlot")) {
            throw "TriggerSlot call was not found."
          }

          Write-Host "Patch verification passed."

      - name: Build WIO-WeaponSwap
        shell: pwsh
        working-directory: upstream/mods/WIO-WeaponSwap
        run: |
          xmake f -p windows -a x64 -m releasedbg --toolchain=msvc -y
          xmake -y

      - name: Locate built DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "upstream/mods/WIO-WeaponSwap/build" -Recurse -Filter "WIO-WeaponSwap.dll" |
            Select-Object -First 1

          if (-not $dll) {
            throw "WIO-WeaponSwap.dll was not produced."
          }

          Write-Host "Built DLL:"
          Write-Host $dll.FullName

          "DLL_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create MO2 package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\WIO-WeaponSwap-DirectWeapons"
          $zip = "$env:GITHUB_WORKSPACE\WIO-WeaponSwap-DirectWeapons.zip"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Path "$stage\Data\F4SE\Plugins" -Force | Out-Null

          # Preserve the upstream mod's Data files if present.
          $upstreamData = "upstream/mods/WIO-WeaponSwap/data"

          if (Test-Path $upstreamData) {
            Copy-Item "$upstreamData\*" "$stage\Data" -Recurse -Force
          }

          # Install our freshly compiled DLL over any upstream DLL.
          Copy-Item $env:DLL_PATH "$stage\Data\F4SE\Plugins\WIO-WeaponSwap.dll" -Force

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          Write-Host "MO2 package created:"
          Write-Host $zip

      - name: Create source patch
        shell: pwsh
        run: |
          Set-Location upstream

          git diff -- mods/WIO-WeaponSwap/src/InputHook.h |
            Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\direct-weapons.patch"

          Set-Location "$env:GITHUB_WORKSPACE"

          if (-not (Test-Path "direct-weapons.patch")) {
            throw "Patch file was not created."
          }

          Write-Host "Source patch created."

      - name: Commit source patch
        shell: pwsh
        run: |
          Copy-Item "direct-weapons.patch" "patches-direct-weapons.patch" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "patches-direct-weapons.patch"

          if (git diff --cached --quiet) {
            Write-Host "No new source patch to commit."
          }
          else {
            git commit -m "Add direct D-pad weapon selection patch"
            git push
          }

      - name: Upload MO2 package
        uses: actions/upload-artifact@v4
        with:
          name: WIO-WeaponSwap-DirectWeapons
          path: WIO-WeaponSwap-DirectWeapons.zip

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: WIO-WeaponSwap-DirectWeapons-DLL
          path: ${{ env.DLL_PATH }}
